<!doctype html>
<!--
  8W8 remote panel — served by schwung-manager at /remote-ui when 8W8 is the
  slot's synth. Talks to the device through the schwungRemote postMessage
  bridge; every continuous control is a 0-127 pot, mirroring the hardware.

  LAID OUT AFTER THE REAL TR-808. The details that make it read as one, all of
  which had to be looked at rather than remembered:

    - the knobs are ORANGE with a white pointer, not black
    - a thin light RULE runs down between every instrument, and a heavier one
      fences the instrument section off from ACCENT and from the master
    - the name plates use Roland's own lettering: the first two letters of
      each word large, the rest small — ACcent, BAss DRum, CLsd HIhat
    - where one channel serves two instruments the alternate sits ABOVE in an
      orange plate: CLaves over RIm SHot
    - "Rhythm Composer TR-808 / Computer Controlled" is bottom right in
      orange with MASTER VOLUME beyond it in the corner, not up in a header
    - the knobs line up in ROWS across the whole rack, which is what makes a
      wall of forty of them readable

  Two departures, both deliberate:

  - No step sequencer. 8W8's step lanes are driven by Move's own step buttons
    through the chain patch, and a second editor here would double-hit
    anything also programmed on Move. The 808's most recognisable feature is
    that bottom row of red-orange-amber-cream buttons, so it stays — as the
    MUTE row, which is what a player actually reaches for mid-pattern.

  - 8W8 adds Drive, a Distortion type and a couple of engine switches that no
    808 ever had. Those go in the lower deck, in the same columns, so the
    upper panel stays the instrument surface the hardware has.

  GPL-3.0.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8W8</title>
<style>
  :root {
    /* Off a TR-808: a dark blue-charcoal case, a panel that is a dark warm
     * grey rather than the silver a 606 or a 909 has, and orange everywhere
     * it matters. */
    --case:    #1d1f24;
    --panel-a: #5b5a56;
    --panel-b: #4a4946;
    --rule:    #9a978f;          /* the thin separators between instruments */
    --rule-hi: #c9c5ba;          /* the heavier section rules               */
    --legend:  #f0eee8;
    --plate:   #ded9c9;          /* instrument name plate, cream            */
    --plate-2: #d1832c;          /* the alternate instrument, orange        */
    --orange:  #e8763a;
    --knob:    #e2762c;          /* the knob caps                           */
    --knob-hi: #f09a4e;
    --led:     #e2402c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1013; padding: 16px;
         font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
         color: var(--legend); }

  .machine { max-width: 1240px; margin: 0 auto; background: var(--case);
             border: 1px solid #0a0b0e; border-radius: 7px; padding: 11px;
             box-shadow: 0 1px 0 #3a3e48 inset, 0 14px 44px #000a; }

  /* The top padding is the logo's band. On the hardware "Roland" sits above
   * the LEVEL row with clear panel around it; without the room it lands on
   * top of the last instrument's knob. */
  .panel { background: linear-gradient(180deg, var(--panel-a), var(--panel-b));
           border: 1px solid #2a2b2e; border-radius: 2px;
           padding: 30px 12px 10px; position: relative; }

  /* Roland's logo sits top right; ours takes its place. */
  .logo { position: absolute; top: 4px; right: 14px;
          font-size: 25px; font-weight: 800; letter-spacing: 2px; color: #fff;
          text-shadow: 0 1px 1px #0007; }

  /* ---- instrument columns ---- */
  .rack { display: flex; align-items: stretch; }
  .col { display: flex; flex-direction: column; align-items: center;
         width: 64px; padding: 0 2px; }
  .col.narrow { width: 56px; }
  .col.sel .plate:last-child { box-shadow: 0 0 0 2px var(--led); }

  /* The rules. Every instrument is fenced off from its neighbour; the
   * sections get a brighter, heavier one. */
  .rule  { width: 1px; background: var(--rule); opacity: .5;
           margin: 16px 0 26px; align-self: stretch; }
  .rule.section { width: 2px; background: var(--rule-hi); opacity: .75;
                  margin: 4px 7px 20px; }

  .lbl { font-size: 7px; letter-spacing: 1.3px; text-transform: uppercase;
         white-space: nowrap; margin-bottom: 3px; color: var(--legend); }
  .knobwrap { display: flex; flex-direction: column; align-items: center; }
  /* Every slot is one height, filled or empty, so the rows line up exactly.
   * Guessing the empty one's height left it a pixel short and dropped a whole
   * DECAY row 2 px out of true — invisible in a screenshot, obvious on a
   * panel. Scoped to #rack: the deck has selects and nothing to align to. */
  #rack .knobwrap { height: 56px; }
  #rack .knobwrap.tall { height: 74px; }

  /* Orange cap, white pointer, dark skirt — the 808's knob. */
  .knob { position: relative; width: 30px; height: 30px; border-radius: 50%;
          background: radial-gradient(circle at 50% 34%,
                      var(--knob-hi) 0 40%, var(--knob) 41% 74%, #a24f16 75% 100%);
          border: 1px solid #2a1408; cursor: ns-resize; touch-action: none;
          box-shadow: 0 1px 2px #0009, 0 0 0 2px #3b3a37; }
  .knob.big { width: 44px; height: 44px; }
  .knob .ptr { position: absolute; left: 50%; top: 50%; width: 2px; height: 13px;
               background: #fffdf8; transform-origin: 50% 0%; border-radius: 1px;
               box-shadow: 0 0 1px #0006; }
  .knob.big .ptr { height: 19px; }
  .val { font-size: 7.5px; color: #d8d5cd; height: 10px; margin-top: 2px;
         opacity: .75; }

  /* ---- the name plates ---- */
  .plates { margin-top: auto; width: 100%; padding-top: 6px; }
  .plate { display: block; background: var(--plate); color: #17171a;
           text-align: center; padding: 3px 1px 2px; border-radius: 1px;
           border: 1px solid #00000040; white-space: nowrap;
           font-size: 6.5px; letter-spacing: .2px; line-height: 1; }
  /* Roland's lettering: the first two letters of each word set larger. */
  .plate b { font-size: 8.5px; font-weight: 700; }
  .plate.alt { background: var(--plate-2); color: #1a1005; }
  /* Only an alternate STACKED ABOVE another plate gets the gap. The congas
   * and the maracas wear the orange plate in the bottom row themselves, and
   * giving them the same margin lifted them 3 px off the baseline every other
   * instrument sits on. */
  .plates .plate.alt:not(:last-child) { margin-bottom: 3px; }
  .plate.empty { background: none; border: 0; }

  /* ---- the branding strip, bottom right, MASTER VOLUME beyond it ---- */
  .footstrip { display: flex; align-items: flex-end; justify-content: flex-end;
               gap: 18px; margin-top: 8px; }
  .model { color: var(--orange); font-size: 23px; font-weight: 500;
           letter-spacing: .3px; line-height: 1; text-align: right; }
  .model small { display: block; font-size: 9px; letter-spacing: 2.2px;
                 color: #ded9cf; font-weight: 400; margin-top: 4px; }
  .master { display: flex; flex-direction: column; align-items: center; }
  .master .lbl { margin: 3px 0 0; font-size: 6.5px; }

  /* ---- the lower deck ---- */
  .deck { background: linear-gradient(180deg, #35373d, #2a2c31);
          border: 1px solid #14161a; border-radius: 2px;
          margin-top: 9px; padding: 8px 12px 10px; }
  .deck .hdr { display: flex; justify-content: space-between; align-items: baseline;
               font-size: 7.5px; letter-spacing: 2px; color: #b9b6ae;
               margin-bottom: 7px; }
  .deck select { width: 56px; height: 18px; border: 1px solid #111; border-radius: 2px;
                 background: #d9d6cd; color: #17171a; font-weight: 700; font-size: 9px; }
  .deck .knobwrap { margin-bottom: 6px; }
  .deck .rule { opacity: .28; margin: 8px 0; }
  .deck .rule.section { opacity: .5; margin: 4px 7px; }

  /* The button row. On the hardware these are the sixteen steps, in four
   * groups of four running red to cream; here they mute. */
  .steps { display: flex; gap: 4px; margin-top: 10px; }
  .step { flex: 1; border: 1px solid #101216; border-radius: 2px;
          padding: 5px 2px 4px; cursor: pointer; text-align: center;
          font: 700 8px/1.1 Helvetica, Arial; color: #17171a;
          box-shadow: 0 2px 0 #00000066; }
  .step .n { display: block; font-size: 6.5px; font-weight: 400; opacity: .5;
             margin-bottom: 2px; }
  .step.muted { filter: brightness(.4) saturate(.45); color: #ffffffbb; }
  .step .led { display: block; width: 5px; height: 5px; border-radius: 50%;
               margin: 3px auto 0; background: #521812; }
  .step.sel .led { background: var(--led); box-shadow: 0 0 5px var(--led); }

  .foot { font-size: 7.5px; color: #6f737c; text-align: right; margin-top: 8px;
          letter-spacing: .3px; }
</style>
</head>
<body>
<div class="machine">

  <div class="panel">
    <div class="logo">8W8</div>
    <div class="rack" id="rack"></div>
    <div class="footstrip">
      <div class="model">Rhythm Composer&nbsp;&nbsp;TR-808
        <small>COMPUTER CONTROLLED</small></div>
      <div class="master" id="master"></div>
    </div>
  </div>

  <div class="deck">
    <div class="hdr">
      <span>DRIVE &amp; DISTORTION &mdash; 8W8's own; no 808 had these</span>
      <span id="lane-name">BASS DRUM</span>
    </div>
    <div class="rack" id="fx"></div>
    <div class="steps" id="steps"></div>
    <div class="foot">
      by athousanddetails &middot; voices transcribed from sc808 (MIT) &middot;
      kick and snare after Werner, Abel &amp; Smith &middot;
      drag knobs vertically, double-click to reset &middot; buttons mute
    </div>
  </div>
</div>

<script src="/static/schwung-remote-api.js"></script>
<script>
(function () {
  "use strict";

  /* Degrade instead of dying if the bridge script is missing (headless
   * screenshot, or schwung-manager not serving /static): every control still
   * draws, nothing is sent anywhere. */
  if (!window.schwungRemote) {
    var noop = function () { return { then: function () {} }; };
    window.schwungRemote = { getParam: noop, setParam: function () {},
                             onParamChange: function () {} };
  }

  var DIST   = ["Diode", "Clip", "Fold", "Crush"];
  var MDIST  = ["Off", "Diode", "Clip", "Fold", "Crush"];
  var CHOKE  = ["Off", "CH>OH", "Mutual"];
  var RSMODE = ["Rim", "Clave"];
  var ENGINE = ["Circuit", "sc808"];
  var METAL  = ["Free", "Retrig"];

  /*
   * The instrument columns, IN THE DSP'S LANE ORDER — which is also the pad
   * order and the mute-bit order, so this array's index is load-bearing.
   *
   *   knobs  fixed slots [Tune, extra, extra, Decay], null for an empty one.
   *          On the real panel the knobs line up in rows across the whole
   *          rack; a per-column list packs them upwards and it stops looking
   *          like an 808 immediately.
   *   alt    the orange plate above the cream one, where the 808 runs two
   *          instruments off a single channel.
   *   isAlt  this lane IS one of those alternates, so it wears the orange
   *          plate itself — the congas and the maracas.
   *   fx     what goes in the lower deck under this column, beyond the Drive
   *          knob and Distortion select every lane gets.
   *   col    the mute button's colour, following the 808's step row.
   */
  var LANES = [
    { id:"bd", name:"BASS DRUM",  col:"#d2452f",
      knobs:[["bd_tune","Tune"],["bd_attack","Attack"],["bd_tone","Tone"],["bd_decay","Decay"]],
      fx:[["bd_engine","Engine",ENGINE]] },
    { id:"sd", name:"SNARE DRUM", col:"#d8532e",
      knobs:[["sd_tune","Tune"],["sd_snappy","Snappy"],["sd_tone","Tone"],["sd_decay","Decay"]],
      fx:[["sd_engine","Engine",ENGINE]] },
    { id:"lt", name:"LOW TOM",    col:"#dd5f2e",
      knobs:[["lt_tune","Tuning"],null,null,["lt_decay","Decay"]] },
    { id:"mt", name:"MID TOM",    col:"#e26b2e",
      knobs:[["mt_tune","Tuning"],null,null,["mt_decay","Decay"]] },
    { id:"ht", name:"HI TOM",     col:"#e6772e",
      knobs:[["ht_tune","Tuning"],null,null,["ht_decay","Decay"]] },
    { id:"lc", name:"LOW CONGA",  col:"#e9832f", isAlt:true,
      knobs:[["lc_tune","Tuning"],null,null,["lc_decay","Decay"]] },
    { id:"mc", name:"MID CONGA",  col:"#ec8f31", isAlt:true,
      knobs:[["mc_tune","Tuning"],null,null,["mc_decay","Decay"]] },
    { id:"hc", name:"HI CONGA",   col:"#ee9b34", isAlt:true,
      knobs:[["hc_tune","Tuning"],null,null,["hc_decay","Decay"]] },
    { id:"rs", name:"RIM SHOT",   col:"#f0a838", alt:"CLAVES",
      knobs:[["rs_tune","Tuning"],null,null,["rs_decay","Decay"]],
      fx:[["rs_mode","Mode",RSMODE]] },
    { id:"ma", name:"MARACAS",    col:"#f2b53f", isAlt:true,
      knobs:[["ma_tune","Tuning"],["ma_attack","Attack"],null,["ma_decay","Decay"]] },
    { id:"cp", name:"HAND CLAP",  col:"#f4c24b",
      knobs:[["cp_tune","Tuning"],["cp_spread","Spread"],["cp_room","Room"],["cp_decay","Decay"]] },
    { id:"cb", name:"COW BELL",   col:"#f0cf66",
      knobs:[["cb_tune","Tuning"],null,null,["cb_decay","Decay"]] },
    { id:"ch", name:"CLSD HIHAT", col:"#eae7d8",
      knobs:[["ch_tune","Tuning"],null,null,["ch_decay","Decay"]],
      fx:[["hh_choke","Choke",CHOKE]] },
    { id:"oh", name:"OPEN HIHAT", col:"#e8e3c4",
      knobs:[["oh_tune","Tuning"],null,null,["oh_decay","Decay"]] },
    { id:"cy", name:"CYMBAL",     col:"#ecdc94",
      knobs:[["cy_tune","Tuning"],["cy_tone","Tone"],null,["cy_decay","Decay"]] }
  ];

  /*
   * The order the panel DRAWS them in, which is not the order the DSP keeps
   * them in. A real 808 runs ... COW BELL, CYMBAL, OPEN HIHAT, CLSD HIHAT
   * along the panel; 8W8's lane enum ends CH, OH, CY because that is the PAD
   * order, read bottom-left to top-right.
   *
   * Reordering LANES itself to match the panel is the obvious shortcut and it
   * is a real bug: LANES' index is the mute bit, so the cymbal's button would
   * have muted the closed hat, silently. test/ui_chain.test.mjs checks LANES
   * against the DSP enum for exactly that reason, and caught it.
   */
  var PANEL = ["bd","sd","lt","mt","ht","lc","mc","hc",
               "rs","ma","cp","cb","cy","oh","ch"];
  function panelLanes() {
    return PANEL.map(function (id) {
      for (var i = 0; i < LANES.length; i++)
        if (LANES[i].id === id) return { L: LANES[i], index: i };
      return null;
    }).filter(Boolean);
  }

  /* Fifteen lanes: the mute mask needs fifteen bits. A byte would silently
   * drop the top four instruments from every mute. */
  var LANE_MASK = 0x7FFF;

  var state = {}, widgets = {}, mutesMask = 0, lane = 0;
  function key(k) { return "synth:" + k; }
  function addWidget(k, fn) { (widgets[k] = widgets[k] || []).push(fn); }
  function send(k, v) {
    state[k] = v; schwungRemote.setParam(key(k), String(v));
    (widgets[k] || []).forEach(function (fn) { fn(v); });
  }
  function apply(k, raw) {
    if (k === "ui_focus") {
      var ln = parseInt(raw, 10);            /* 0-14 lane, 15 = master */
      if (ln >= 0 && ln < LANES.length && ln !== lane) selectLane(ln);
      return;
    }
    var v = parseInt(raw, 10); if (isNaN(v)) return;
    if (k === "mutes") { mutesMask = v; renderMutes(); return; }
    if (widgets[k]) { state[k] = v; widgets[k].forEach(function (fn) { fn(v); }); }
  }

  /* ---- widgets ---- */
  function knob(parent, k, label, big) {
    var wrap = document.createElement("div");
    wrap.className = "knobwrap" + (big ? " tall" : "");
    var lg = document.createElement("div"); lg.className = "lbl";
    lg.textContent = label; lg.style.visibility = label ? "" : "hidden";
    var kn = document.createElement("div"); kn.className = "knob" + (big ? " big" : "");
    var ptr = document.createElement("div"); ptr.className = "ptr";
    kn.appendChild(ptr);
    var val = document.createElement("div"); val.className = "val";
    function render(v) {
      ptr.style.transform = "translate(-50%,0) rotate(" + (-135 + v / 127 * 270 + 180) + "deg)";
      val.textContent = v;
    }
    addWidget(k, render);
    var y0 = null, v0 = 0;
    function move(e) {
      if (y0 === null) return;
      var y = e.touches ? e.touches[0].clientY : e.clientY;
      var v = Math.max(0, Math.min(127, Math.round(v0 + (y0 - y) * 0.7)));
      if (v !== state[k]) send(k, v);
      e.preventDefault();
    }
    function up() { y0 = null;
      window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up);
      window.removeEventListener("touchmove", move); window.removeEventListener("touchend", up); }
    function down(e) {
      y0 = e.touches ? e.touches[0].clientY : e.clientY; v0 = state[k] | 0;
      window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
      window.addEventListener("touchmove", move, { passive: false });
      window.addEventListener("touchend", up);
      e.preventDefault();
    }
    kn.addEventListener("mousedown", down);
    kn.addEventListener("touchstart", down, { passive: false });
    /* reset = the DSP's own default. 8W8's defaults are sc808's declared
     * arguments and are nowhere near pot centre, so it has to ask. */
    kn.addEventListener("dblclick", function () {
      schwungRemote.setParam(key(k), "default");
      setTimeout(function () {
        schwungRemote.getParam(key(k)).then(function (v) { apply(k, v); });
      }, 120);
    });
    wrap.appendChild(lg); wrap.appendChild(kn); wrap.appendChild(val);
    parent.appendChild(wrap); render(state[k] | 0);
    return wrap;
  }

  function sel(parent, k, label, opts) {
    var wrap = document.createElement("div"); wrap.className = "knobwrap";
    var lg = document.createElement("div"); lg.className = "lbl"; lg.textContent = label;
    var s = document.createElement("select");
    opts.forEach(function (o, i) {
      var op = document.createElement("option"); op.value = i; op.textContent = o;
      s.appendChild(op);
    });
    s.addEventListener("change", function () { send(k, s.value | 0); });
    addWidget(k, function (v) { s.value = Math.min(v, opts.length - 1); });
    wrap.appendChild(lg); wrap.appendChild(s); parent.appendChild(wrap);
    s.value = state[k] | 0;
  }

  function column(parent, cls) {
    var c = document.createElement("div");
    c.className = "col" + (cls ? " " + cls : "");
    parent.appendChild(c); return c;
  }
  function rule(parent, section) {
    var d = document.createElement("div");
    d.className = "rule" + (section ? " section" : "");
    parent.appendChild(d);
  }
  function gap(parent, n) {
    for (var i = 0; i < n; i++) {
      var g = document.createElement("div");
      g.className = "knobwrap"; parent.appendChild(g);
    }
  }

  /*
   * Roland's lettering on the name plates: the first two letters of each word
   * set large, the rest small. ACcent, BAss DRum, CLsd HIhat. It is a small
   * thing and it is most of why the plates look right.
   */
  function plateText(name) {
    return name.split(" ").map(function (w) {
      return "<b>" + w.slice(0, 2) + "</b>" + w.slice(2).toLowerCase();
    }).join(" ");
  }
  function plates(col, L) {
    var box = document.createElement("div"); box.className = "plates";
    var top = document.createElement("span");
    if (L.alt) { top.className = "plate alt"; top.innerHTML = plateText(L.alt); }
    else {
      /* Keeps every cream plate on one baseline whether or not this column
       * carries an alternate above it. */
      top.className = "plate empty"; top.innerHTML = "&nbsp;";
    }
    box.appendChild(top);
    var p = document.createElement("span");
    p.className = "plate" + (L.isAlt ? " alt" : "");
    p.innerHTML = plateText(L.name); box.appendChild(p);
    col.appendChild(box);
  }

  /* ---- upper panel: ACCENT | the instruments ---- */
  var rack = document.getElementById("rack");
  var cols = [];
  {
    var ac = column(rack, "narrow");
    knob(ac, "accent", "Level");
    gap(ac, 3);
    var box = document.createElement("div"); box.className = "plates";
    var sp = document.createElement("span"); sp.className = "plate empty";
    sp.innerHTML = "&nbsp;"; box.appendChild(sp);
    var acp = document.createElement("span"); acp.className = "plate";
    acp.innerHTML = plateText("ACCENT"); box.appendChild(acp);
    ac.appendChild(box);
    rule(rack, true);
  }
  panelLanes().forEach(function (e, pos) {
    if (pos) rule(rack);
    var L = e.L;
    var c = column(rack);
    knob(c, L.id + "_level", "Level");
    L.knobs.forEach(function (kk) {
      if (kk) knob(c, kk[0], kk[1]); else gap(c, 1);
    });
    plates(c, L);
    cols[e.index] = c;                     /* indexed by LANE, not position */
  });

  /* MASTER VOLUME lives in the bottom-right corner, past the branding. */
  {
    var m = document.getElementById("master");
    knob(m, "volume", "", true);
    var ml = document.createElement("div"); ml.className = "lbl";
    ml.textContent = "MASTER VOLUME"; m.appendChild(ml);
  }

  /* ---- lower deck: the controls no 808 had, in the same columns ---- */
  var fx = document.getElementById("fx");
  {
    var pad = column(fx, "narrow"); pad.style.visibility = "hidden";
    rule(fx, true);
  }
  panelLanes().forEach(function (e, pos) {
    if (pos) rule(fx);
    var L = e.L;
    var c = column(fx);
    knob(c, L.id + "_drive", "Drive");
    sel(c, L.id + "_dist_type", "Dist", DIST);
    if (L.fx) L.fx.forEach(function (x) { sel(c, x[0], x[1], x[2]); });
  });
  {
    rule(fx, true);
    var mm = column(fx, "narrow");
    knob(mm, "master_drive", "Master");
    sel(mm, "master_dist", "Dist", MDIST);
    sel(mm, "note_map", "Notes", ["Rack 36", "GM"]);
    sel(mm, "metal_run", "Metal", METAL);
  }

  /* ---- the button row: the 808's steps, muting instead of stepping ---- */
  var steps = document.getElementById("steps");
  var stepBtns = [];
  panelLanes().forEach(function (e, pos) {
    var L = e.L, idx = e.index;     /* idx is the LANE, pos is where it sits */
    var b = document.createElement("div");
    b.className = "step"; b.style.background = L.col;
    b.innerHTML = '<span class="n">' + (pos + 1) + '</span>' + L.id.toUpperCase() +
                  '<span class="led"></span>';
    b.title = L.name + " — click to mute";
    b.addEventListener("click", function () {
      mutesMask = (mutesMask ^ (1 << idx)) & LANE_MASK;
      schwungRemote.setParam(key("mutes"), String(mutesMask));
      renderMutes();
    });
    steps.appendChild(b); stepBtns[idx] = b;
  });
  function renderMutes() {
    stepBtns.forEach(function (b, idx) {
      if (!b) return;
      b.className = "step" + (((mutesMask >> idx) & 1) ? " muted" : "") +
                    (idx === lane ? " sel" : "");
    });
  }

  /*
   * Follow the device. The on-device editor writes synth:ui_focus (the lane
   * index) on every pad it follows, and the manager pushes writes and re-reads
   * it on its refresh. Nothing needs selecting here — every instrument is
   * already on the panel — so following just moves the highlight and the
   * deck's header, which is what tells you which drum you last hit. Lane 15
   * is Master and has no column; apply() ignores it.
   */
  function selectLane(i) {
    lane = i;
    cols.forEach(function (c, j) {
      if (c) c.className = "col" + (j === i ? " sel" : "");
    });
    document.getElementById("lane-name").textContent = LANES[i].name;
    renderMutes();
  }

  /* ---- bridge ---- */
  schwungRemote.onParamChange(function (params) {
    Object.keys(params).forEach(function (full) {
      if (full.indexOf("synth:") === 0) apply(full.substring(6), params[full]);
    });
  });
  function seed() {
    Object.keys(widgets).concat(["mutes", "ui_focus"]).forEach(function (k) {
      schwungRemote.getParam(key(k)).then(function (v) {
        if (v !== undefined && v !== null && v !== "") apply(k, v);
      });
    });
  }

  selectLane(0);
  seed();
  setTimeout(seed, 400); setTimeout(seed, 1500);
})();
</script>
</body>
</html>
